services:
  # Express API: video catalog + trivia pop tracks (admin writes need ADMIN_KEY).
  - type: web
    name: bubbletracks-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: bubble_tracks
      - key: ADMIN_KEY
        sync: false
      - key: CLIENT_URL
        sync: false

  # Static front-end (Vite + React, YouTube IFrame Player API).
  - type: web
    name: bubble-tracks
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Update this if your API service ends up with a different name/URL.
      - key: VITE_API_URL
        value: https://bubbletracks-api.onrender.com/api
